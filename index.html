<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Logo Sunumu</title>
    <style>
        /* Genel Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Çizimdeki gibi modern ve temiz bir font */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Figma/Illustrator çalışma yüzeyine benzeyen koyu gri arkaplan */
            background-color: #333333; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 430px; /* iPhone Pro Max ekran genişliği */
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Kutular arasındaki boşluk */
        }

        /* Kutuların Genel Tasarımı */
        .box {
            border: 4px solid #000000; /* Çizimdeki kalın siyah çerçeve */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #000000;
            width: 100%;
        }

        /* Özel Kutu Boyutları */
        .box-logo {
            height: 280px; /* En üstteki büyük logo kutusu */
        }

        .box-standard {
            height: 100px; /* Diğer standart kutular */
        }

        /* En alttaki çözünürlük yazısı */
        .footer-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: auto; /* Yazıyı sayfanın en altına iter */
            padding-top: 40px;
            padding-bottom: 20px;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Logo Alanı -->
        <div class="box box-logo">
            presentation logo
        </div>

        <!-- Renk Paleti Alanı -->
        <div class="box box-standard">
            color palette
        </div>

        <!-- Tipografi Alanı -->
        <div class="box box-standard">
            font-family
        </div>

        <!-- İletişim / WhatsApp Alanı -->
        <div class="box box-standard">
            contact-whatsapp
        </div>

        <!-- Alt Bilgi -->
        <div class="footer-text">
            iPhone 17 Pro Max Resolution
        </div>

    </div>

</body>
</html>
