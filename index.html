<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Logo Sunumu - İnteraktif</title>
    <style>
        /* Genel Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #333333; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 430px; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        /* Kutuların Genel Tasarımı */
        .box {
            border: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #000000;
            width: 100%;
            background-color: #ffffff;
        }

        .box-logo {
            height: 280px; 
        }

        .box-standard {
            height: 100px; 
        }

        /* Yıldız SVG Tasarımı */
        #star-logo {
            width: 130px;
            height: 130px;
            transition: fill 0.3s ease; /* Renk değişirken yumuşak geçiş yapar */
        }

        /* --- RENK PALETİ KUTUSU ÖZEL AYARLARI --- */
        .color-box {
            cursor: pointer;
            user-select: none;
        }

        .circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
        }

        /* Kapalı Haldeki Görünüm */
        .initial-view {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        /* Açık Haldeki Görünüm */
        .expanded-view {
            display: none; /* Başlangıçta gizli */
            width: 100%;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        /* Javascript is-open class'ını eklediğinde görünümler değişir */
        .color-box.is-open .initial-view {
            display: none;
        }

        .color-box.is-open .expanded-view {
            display: flex;
        }

        .dashed-line {
            width: 40px;
            border-top: 3px dashed #000000;
            margin: 0 15px;
        }

        .colors-group {
            display: flex;
            gap: 6px;
        }

        .color-option {
            transition: transform 0.2s;
        }

        .color-option:hover {
            transform: scale(1.15); /* Üzerine gelince hafif büyür */
        }

        /* En alttaki çözünürlük yazısı */
        .footer-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: auto; 
            padding-top: 40px;
            padding-bottom: 20px;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Logo Alanı (Kodla çizilmiş Yıldız SVG) -->
        <div class="box box-logo">
            <svg id="star-logo" viewBox="0 0 24 24" fill="#000000">
                <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
            </svg>
        </div>

        <!-- İnteraktif Renk Paleti Alanı -->
        <div class="box box-standard color-box" id="colorBox">
            
            <!-- Palet Kapalıyken (Tek Renk) -->
            <div class="initial-view">
                <div class="circle" id="current-color-circle" style="background-color: #000000;"></div>
            </div>

            <!-- Palet Açıkken (Tüm Renkler) -->
            <div class="expanded-view">
                <div class="circle color-option" style="background-color: #000000;" data-color="#000000"></div>
                <div class="dashed-line"></div>
                <div class="colors-group">
                    <div class="circle color-option" style="background-color: #8C8080;" data-color="#8C8080"></div>
                    <div class="circle color-option" style="background-color: #E60000;" data-color="#E60000"></div>
                    <div class="circle color-option" style="background-color: #DDE21A;" data-color="#DDE21A"></div>
                </div>
            </div>

        </div>

        <!-- Tipografi Alanı -->
        <div class="box box-standard">
            font-family
        </div>

        <!-- İletişim / WhatsApp Alanı -->
        <div class="box box-standard">
            contact-whatsapp
        </div>

        <!-- Alt Bilgi -->
        <div class="footer-text">
            iPhone 17 Pro Max Resolution
        </div>

    </div>

    <!-- Tıklama ve Renk Değiştirme Mantığı (Javascript) -->
    <script>
        const colorBox = document.getElementById('colorBox');
        const starLogo = document.getElementById('star-logo');
        const currentCircle = document.getElementById('current-color-circle');

        colorBox.addEventListener('click', function(event) {
            
            // Eğer tıklanan element bir 'color-option' (renk seçeneği) ise:
            if (event.target.classList.contains('color-option')) {
                
                // Seçilen rengin kodunu al
                const selectedColor = event.target.getAttribute('data-color');
                
                // Yıldızın rengini değiştir
                starLogo.setAttribute('fill', selectedColor);
                
                // Kapalı durumdaki yuvarlağın rengini de seçilen renkle güncelle
                currentCircle.style.backgroundColor = selectedColor;
                
                // Paleti kapat
                colorBox.classList.remove('is-open');
                
            } else {
                // Renge tıklanmadıysa (kutunun boş bir yerine tıklandıysa) paleti aç/kapat
                colorBox.classList.toggle('is-open');
            }
        });
    </script>

</body>
</html>
