<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Sunum Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Sayfanın varsayılan arka planı */
            background-color: #ffffff; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* --- ÜST KISIM: LOGO ÖNİZLEME ALANI --- */
        #preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        #logo-box {
            /* Logonun arkasındaki kutu */
            background-color: #3b0909; 
            width: 300px;
            height: 300px;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }

        /* Sizin ekleyeceğiniz SVG'nin boyut ayarı */
        #logo-box svg {
            width: 60%;
            height: 60%;
            transition: fill 0.3s ease;
        }


        /* --- ALT KISIM: KONTROL PANELİ --- */
        #control-panel {
            background-color: #9ea622; /* Görseldeki yeşilimsi sarı ton */
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Sol Taraf: HEX Kod Gösterimi */
        .hex-display-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .color-preview-box {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 8px;
        }

        .hex-text {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Sağ Taraf: Renk Seçiciler */
        .color-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .control-group span {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* Renk seçici input'un görünümünü düzenleme */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 60px;
            height: 30px;
            border-radius: 15px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #333;
            border-radius: 15px;
        }

        /* --- SOSYAL MEDYA İKONLARI ALANI --- */
        #footer {
            background-color: #ffffff;
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-icon {
            width: 40px;
            height: 40px;
            background-color: #007bff;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }
        .social-icon.insta { background-color: #e1306c; }
        .social-icon.wp { background-color: #25d366; }
        .social-icon.tw { background-color: #1da1f2; }
    </style>
</head>
<body>

    <!-- ÜST KISIM: LOGO GÖRÜNÜMÜ -->
    <div id="preview-area">
        <div id="logo-box">
            
            <!-- BURAYA KENDİ SVG LOGONUZU YAPIŞTIRACAKSINIZ -->
            <!-- Örnek olarak Ai yazan bir SVG ekledim -->
            <!-- ÖNEMLİ: Renginin değişmesini istediğiniz path veya text etiketine id="logo-vector" eklemelisiniz! -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <text id="logo-vector" x="50" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="55" fill="#f39200" text-anchor="middle" dominant-baseline="middle">Ai</text>
            </svg>
            <!-- SVG BİTİŞİ -->

        </div>
    </div>

    <!-- ALT KISIM: RENK KONTROL PANELİ -->
    <div id="control-panel">
        
        <!-- Seçilen Rengin Hex Kodunu Gösteren Kutu -->
        <div class="hex-display-container">
            <div class="color-preview-box" id="active-color-box"></div>
            <div class="hex-text">HEX CODE: <span id="hex-value">#ffffff</span></div>
        </div>

        <!-- Renk Seçim Ayarları -->
        <div class="color-controls">
            <label class="control-group">
                <span>Ana Arka Plan Rengi:</span>
                <input type="color" id="page-bg-color" value="#ffffff">
            </label>
            
            <label class="control-group">
                <span>Logo Arka Planı (Kutu):</span>
                <input type="color" id="box-bg-color" value="#3b0909">
            </label>

            <label class="control-group">
                <span>Logo Rengi (Vektör):</span>
                <input type="color" id="vector-color" value="#f39200">
            </label>
        </div>

    </div>

    <!-- SOSYAL MEDYA İKONLARI -->
    <div id="footer">
        <div class="social-icon">🎨</div>
        <div class="social-icon insta">📸</div>
        <div class="social-icon wp">💬</div>
        <div class="social-icon tw">🐦</div>
    </div>

    <!-- JAVASCRIPT KODLARI (İnteraktiflik için) -->
    <script>
        // HTML elementlerini seçiyoruz
        const pageBgInput = document.getElementById('page-bg-color');
        const boxBgInput = document.getElementById('box-bg-color');
        const vectorColorInput = document.getElementById('vector-color');
        
        const bodyElement = document.body;
        const logoBox = document.getElementById('logo-box');
        const logoVector = document.getElementById('logo-vector');
        
        const activeColorBox = document.getElementById('active-color-box');
        const hexValueText = document.getElementById('hex-value');

        // Hex kodunu güncelleyen fonksiyon
        function updateHexDisplay(colorValue) {
            activeColorBox.style.backgroundColor = colorValue;
            hexValueText.textContent = colorValue.toUpperCase();
        }

        // 1. Ana Arka Plan Değiştiğinde
        pageBgInput.addEventListener('input', function(e) {
            bodyElement.style.backgroundColor = e.target.value;
            updateHexDisplay(e.target.value);
        });

        // 2. Kutu Arka Planı Değiştiğinde
        boxBgInput.addEventListener('input', function(e) {
            logoBox.style.backgroundColor = e.target.value;
            updateHexDisplay(e.target.value);
        });

        // 3. Logonun Kendi Rengi Değiştiğinde
        vectorColorInput.addEventListener('input', function(e) {
            // Eğer logonuz SVG path'lerden oluşuyorsa fill veya stroke'u değiştirir
            if(logoVector) {
                logoVector.setAttribute('fill', e.target.value);
            }
            updateHexDisplay(e.target.value);
        });

        // Başlangıçta ana arka plan rengini HEX panelinde göster
        updateHexDisplay(pageBgInput.value);
    </script>

</body>
</html>
