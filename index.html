<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Logo Sunumu - Pro Etkileşim</title>
    <style>
        /* Genel Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #333333; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 430px; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        /* Kutuların Genel Tasarımı */
        .box {
            border: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #000000;
            width: 100%;
            background-color: #ffffff;
            position: relative; /* İçeriklerin taşmasını önlemek için */
            overflow: hidden;
        }

        .box-logo {
            height: 280px; 
        }

        .box-standard {
            height: 100px; 
        }

        /* Yıldız SVG Tasarımı */
        #star-logo {
            width: 130px;
            height: 130px;
            /* Renk geçişini çok daha yumuşak ve tatmin edici yaptık */
            transition: fill 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        /* --- PRO RENK PALETİ ANİMASYONU --- */
        .color-box {
            cursor: pointer;
            user-select: none;
            /* Dokunma hissini artırmak için */
            -webkit-tap-highlight-color: transparent; 
        }

        /* Renklerin hizalandığı ana taşıyıcı */
        .palette {
            display: flex;
            gap: 0; /* Kapalıyken aralarında boşluk yok */
            justify-content: center;
            align-items: center;
            /* Flex gap (boşluk) değerine yaylanma efekti veriyoruz */
            transition: gap 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Menü açıldığında aradaki boşluklar genişler */
        .color-box.is-open .palette {
            gap: 16px; 
        }

        /* Squarcle (Yuvarlatılmış Kare) Tasarımı */
        .color-swatch {
            width: 0; /* Kapalıyken genişlik 0 (görünmez) */
            height: 48px; /* Daha iyi dokunma alanı */
            border-radius: 14px; /* İnsan beyninin sevdiği yumuşak köşe oranı */
            opacity: 0;
            transform: scale(0.3); /* Küçülerek kaybolma efekti */
            /* Yaylanarak açılma animasyonu (Spring Physics) */
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08); /* Açık renklerde sınırları belli eden ince iç gölge */
            border: 2px solid transparent;
        }

        /* Seçili olan renk kapalıyken bile her zaman görünür ve merkezdedir */
        .color-swatch.is-active {
            width: 48px;
            opacity: 1;
            transform: scale(1);
            border-color: rgba(0,0,0,0.15); /* Seçili olduğunu vurgulayan çok hafif bir çerçeve */
        }

        /* Kutu tıklandığında (açıldığında) tüm renkler genişler ve görünür olur */
        .color-box.is-open .color-swatch {
            width: 48px;
            opacity: 1;
            transform: scale(1);
        }

        /* Sadece açıkken üzerine gelince hafif havaya kalkma efekti */
        .color-box.is-open .color-swatch:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        /* En alttaki çözünürlük yazısı */
        .footer-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: auto; 
            padding-top: 40px;
            padding-bottom: 20px;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Logo Alanı -->
        <div class="box box-logo">
            <svg id="star-logo" viewBox="0 0 24 24" fill="#000000">
                <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
            </svg>
        </div>

        <!-- Pro İnteraktif Renk Paleti Alanı -->
        <div class="box box-standard color-box" id="colorBox">
            <div class="palette">
                <!-- data-color içerisine renk kodları yazılır. is-active class'ı seçili olanı belirler. -->
                <div class="color-swatch is-active" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-swatch" style="background-color: #8C8080;" data-color="#8C8080"></div>
                <div class="color-swatch" style="background-color: #E60000;" data-color="#E60000"></div>
                <div class="color-swatch" style="background-color: #DDE21A;" data-color="#DDE21A"></div>
            </div>
        </div>

        <!-- Tipografi Alanı -->
        <div class="box box-standard">
            font-family
        </div>

        <!-- İletişim / WhatsApp Alanı -->
        <div class="box box-standard">
            contact-whatsapp
        </div>

        <!-- Alt Bilgi -->
        <div class="footer-text">
            iPhone 17 Pro Max Resolution
        </div>

    </div>

    <!-- Pürüzsüz Etkileşim Mantığı -->
    <script>
        const colorBox = document.getElementById('colorBox');
        const starLogo = document.getElementById('star-logo');
        const swatches = document.querySelectorAll('.color-swatch');

        colorBox.addEventListener('click', function(event) {
            // Tıklanan elementin bir renk kutusu olup olmadığını kontrol et
            const clickedSwatch = event.target.closest('.color-swatch');
            
            // Eğer menü zaten açıksa ve bir renge tıklandıysa:
            if (colorBox.classList.contains('is-open')) {
                if (clickedSwatch) {
                    // 1. Yıldızın rengini değiştir
                    const selectedColor = clickedSwatch.getAttribute('data-color');
                    starLogo.setAttribute('fill', selectedColor);
                    
                    // 2. Önceki seçili rengin aktifliğini kaldır, yenisine ekle
                    swatches.forEach(s => s.classList.remove('is-active'));
                    clickedSwatch.classList.add('is-active');
                    
                    // 3. Flexbox mantığı sayesinde menü kapandığında, 
                    // sadece '.is-active' olan görünür kalır ve pürüzsüzce merkeze kayar.
                }
                // Menüyü kapat (diğer renkleri gizle)
                colorBox.classList.remove('is-open');
            } else {
                // Menü kapalıysa aç (tüm renkleri göster)
                colorBox.classList.add('is-open');
            }
        });
    </script>

</body>
</html>
</body>
</html>
