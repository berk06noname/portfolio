<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Sunumu ve Renk Kontrolü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
        }

        /* Üst Logo Alanı */
        .top-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .logo-container {
            position: relative;
            cursor: pointer;
            padding: 12px;
            border-radius: 12px;
        }

        .custom-logo-svg {
            width: 220px;
            height: 220px;
            transition: transform 0.3s ease;
            display: block;
        }

        .logo-container:hover .custom-logo-svg {
            transform: scale(1.05);
        }

        /* --- ORTA RENK KONTROL PANELİ (Görseldeki Zeytin Yeşili Alan) --- */
        .color-control-wrapper {
            background-color: #b5b123; /* Görseldeki zeytin/eskitme sarı tonu */
            width: 100%;
            padding: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Sol Taraftaki Renk Matrisi / Alanı */
        .color-matrix-preview {
            width: 90px;
            height: 90px;
            border: 2px solid #ff0000;
            background-color: #d9d9d9;
            position: relative;
        }

        .color-matrix-sub {
            width: 24px;
            height: 90px;
            border: 2px solid #ff0000;
            background-color: #d9d9d9;
        }

        .color-box-target {
            width: 80px;
            height: 80px;
            border: 2px solid #000;
            background-color: #330000;
            border-radius: 6px;
        }

        .hex-box-area {
            background-color: #d9d9d9;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #999;
            margin-top: 4px;
            text-align: center;
        }

        /* Sağ Taraftaki Renk Seçenekleri Listesi */
        .color-options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .color-option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #ccc;
        }

        .color-chip {
            width: 50px;
            height: 20px;
            border-radius: 20px;
            border: 1px solid #000;
        }

        .chip-white { background-color: #ffffff; }
        .chip-dark { background-color: #330000; }
        .chip-orange { background-color: #ff9a00; }
        .chip-none { 
            background-color: #ffffff; 
            position: relative; 
        }
        .chip-none::after {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background-color: red;
            transform: translateY(-50%) rotate(-20deg);
        }

        /* En Alt İkonlar Alanı */
        .bottom-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            padding-top: 16px;
        }

        .social-icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .social-icon-btn:hover {
            transform: translateY(-2px);
        }

        .icon-blue { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .icon-insta { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .icon-whatsapp { background-color: #25D366; }
        .icon-telegram { background-color: #29b2fe; }

        .social-svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Üst Logo Alanı -->
    <div class="top-section">
        <div class="logo-container" id="mainLogoContainer">
            <!-- Gönderdiğiniz görseldeki Ai logosu SVG formatında uyarlandı -->
            <svg class="custom-logo-svg" viewBox="0 0 250 250">
                <rect class="part-bg" width="250" height="250" rx="42.74" ry="42.74" fill="#330000"/>
                <g class="part-group" fill="#ff9a00">
                    <path d="M122.11,66.15h-37.41l-42.97,115.62h33.48l5.58-17.27h42.98l5.58,17.27h34.5l-41.73-115.62h0Zm-19.84,69.5h-12.17l12.17-37.69,12.17,37.69h-12.17Z"/>
                    <rect x="168.12" y="90.74" width="30.98" height="91.03"/>
                    <path d="M200.12,74.28c.09,8.49-6.78,14.49-16.5,14.41-9.73,.08-16.59-5.92-16.5-14.41-.09-8.49,6.78-14.49,16.5-14.41,9.73-.08,16.59,5.92,16.5,14.41Z"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- Orta Renk Kontrol Paneli -->
    <div class="color-control-wrapper">
        <div style="display: flex; gap: 4px;">
            <div class="color-matrix-preview"></div>
            <div class="color-matrix-sub"></div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="color-box-target"></div>
            <div class="hex-box-area">HEX CODE:</div>
        </div>

        <div class="color-options-list">
            <div class="color-option-row">
                <span>Ana Arka Plan Rengi:</span>
                <div class="color-chip chip-white"></div>
            </div>
            <div class="color-option-row">
                <span>Arka Plan Rengi:</span>
                <div class="color-chip chip-dark"></div>
            </div>
            <div class="color-option-row">
                <span>Logo Rengi:</span>
                <div class="color-chip chip-orange"></div>
            </div>
            <div class="color-option-row">
                <span>Kullanılan Yazı Rengi:</span>
                <div class="color-chip chip-none"></div>
            </div>
        </div>
    </div>

    <!-- Alt Sosyal Medya İkonları -->

        <a href="#" class="social-icon-btn icon-blue" title="Portfolyo / Profil">

        </a>

    </div>

</body>
</html>
