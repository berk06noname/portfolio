<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Logo Sunumu - Photoshop Renk Paneli</title>
    <style>
        /* Genel Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #333333; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 430px; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        /* Kutuların Genel Tasarımı */
        .box {
            border: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #000000;
            width: 100%;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .box-logo {
            height: 280px; 
            flex-direction: column;
            gap: 12px;
        }

        .box-standard {
            height: 100px; 
        }

        /* --- ÇOKLU YILDIZ GRUBU --- */
        .stars-wrapper {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }

        .star-container {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background-color 0.2s ease;
        }

        .star-container.selected {
            background-color: rgba(0, 0, 0, 0.06);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.15);
        }

        .star-icon {
            width: 65px;
            height: 65px;
            transition: transform 0.3s ease;
            display: block;
        }

        .star-icon.main-star {
            width: 85px;
            height: 85px;
        }

        .star-container:hover .star-icon {
            transform: scale(1.08) rotate(5deg);
        }

        /* --- ADOBE PHOTOSHOP / ILLUSTRATOR RENK SEÇİCİ PANELİ --- */
        .ps-picker-box {
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100px;
            transition: height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #ffffff;
            flex-direction: column;
            padding: 0;
            justify-content: flex-start;
        }

        .ps-picker-box.is-open {
            height: 260px; 
        }

        .ps-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100px;
            padding: 0 20px;
        }

        .ps-picker-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-preview-graphic {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            background: #000000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 2px solid #000;
        }

        .ps-picker-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .ps-picker-arrow {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .ps-picker-box.is-open .ps-picker-arrow {
            transform: rotate(180deg);
        }

        /* Açılan Renk Seçici Gövdesi */
        .ps-picker-body {
            display: none;
            width: 100%;
            padding: 12px;
            background-color: #f7f7f7;
            border-top: 2px solid #000000;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .ps-picker-box.is-open .ps-picker-body {
            display: flex;
        }

        /* 1. Soldaki Renk / Doygunluk Karesi */
        .ps-color-square {
            width: 150px;
            height: 150px;
            position: relative;
            cursor: crosshair;
            border: 2px solid #333;
            background: rgb(255, 0, 0); 
            touch-action: none;
        }

        .ps-color-square::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, #fff, rgba(255,255,255,0));
            pointer-events: none;
        }

        .ps-color-square::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, #000);
            pointer-events: none;
        }

        /* Kare İçi İmleç (Başlangıçta siyah için sol alt köşede) */
        .square-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #fff;
            background-color: transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.9);
            top: 100%;
            left: 0%;
        }

        /* 2. Sağdaki Dikey Renk (Hue) Şeridi */
        .ps-hue-slider {
            width: 25px;
            height: 150px;
            position: relative;
            cursor: pointer;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
            touch-action: none;
        }

        /* Şerit İçi İmleç */
        .hue-marker {
            position: absolute;
            left: -4px;
            right: -4px;
            height: 6px;
            background: #fff;
            border: 1px solid #000;
            transform: translateY(-50%);
            pointer-events: none;
            top: 0%;
        }

        /* Sağ Taraf HEX ve Bilgi Alanı */
        .ps-info-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }

        .ps-info-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-family: monospace;
            font-weight: 700;
            color: #333;
        }

        .ps-hex-input {
            font-family: monospace;
            font-weight: 700;
            font-size: 0.85rem;
            width: 85px;
            padding: 4px;
            border: 1px solid #999;
            background: #fff;
            text-align: center;
            outline: none;
            border-radius: 4px;
        }

        /* --- TİPOGRAFİ ALANI STİLLERİ --- */
        .typography-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .font-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .font-preview {
            font-size: 0.95rem;
            color: #666666;
            font-weight: 400;
        }

        /* --- İLETİŞİM / WHATSAPP ALANI STİLLERİ --- */
        .whatsapp-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100%;
            transition: background-color 0.2s ease;
        }

        .whatsapp-link:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
            fill: #25D366;
        }

        .whatsapp-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Çoklu Yıldız Logo Alanı -->
        <div class="box box-logo">
            <div class="stars-wrapper">
                <!-- Sol Yıldız -->
                <div class="star-container" data-star-index="0">
                    <svg class="star-icon" viewBox="0 0 24 24" fill="#000000">
                        <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                    </svg>
                </div>
                <!-- Ana (Ortadaki Büyük) Yıldız -->
                <div class="star-container selected" data-star-index="1">
                    <svg class="star-icon main-star" viewBox="0 0 24 24" fill="#000000">
                        <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                    </svg>
                </div>
                <!-- Sağ Yıldız -->
                <div class="star-container" data-star-index="2">
                    <svg class="star-icon" viewBox="0 0 24 24" fill="#000000">
                        <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Photoshop / Illustrator Tarzı Renk Paneli -->
        <div class="box ps-picker-box" id="psPickerBox">
            <div class="ps-picker-header" id="psPickerToggle">
                <div class="ps-picker-header-left">
                    <div class="color-preview-graphic" id="headerColorPreview"></div>
                    <span class="ps-picker-title">Renk Seç (Photoshop)</span>
                </div>
                <span class="ps-picker-arrow">▼</span>
            </div>

            <div class="ps-picker-body">
                <!-- Soldaki Kare Renk Matrisi -->
                <div class="ps-color-square" id="psColorSquare">
                    <div class="square-marker" id="squareMarker"></div>
                </div>

                <!-- Sağdaki Dikey Renk (Hue) Şeridi -->
                <div class="ps-hue-slider" id="psHueSlider">
                    <div class="hue-marker" id="hueMarker"></div>
                </div>

                <!-- HEX Giriş Alanı -->
                <div class="ps-info-col">
                    <div class="ps-info-row">
                        <span>HEX:</span>
                        <input type="text" id="psHexInput" class="ps-hex-input" value="#000000">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tipografi Alanı -->
        <div class="box box-standard">
            <div class="typography-content">
                <span class="font-name">Montserrat</span>
                <span class="font-preview">Aa Bb Cc 123</span>
            </div>
        </div>

        <!-- İletişim / WhatsApp Alanı -->
        <div class="box box-standard">
            <a href="https://wa.me/905400451606" target="_blank" class="whatsapp-link">
                <svg class="whatsapp-icon" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                <span class="whatsapp-text">WhatsApp İletişim</span>
            </a>
        </div>

    </div>

    <!-- Photoshop Renk Paneli Mantığı -->
    <script>
        const starContainers = document.querySelectorAll('.star-container');
        let activeStarContainer = document.querySelector('.star-container.selected');

        // Yıldız seçimi
        starContainers.forEach(container => {
            container.addEventListener('click', function(e) {
                e.stopPropagation();
                starContainers.forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                activeStarContainer = this;
            });
        });

        // Panel Açma / Kapatma
        const psPickerBox = document.getElementById('psPickerBox');
        const psPickerToggle = document.getElementById('psPickerToggle');

        psPickerToggle.addEventListener('click', function() {
            psPickerBox.classList.toggle('is-open');
        });

        // Renk Paneli Mantığı (Başlangıç Değerleri Siyah #000000 için ayarlandı)
        const psColorSquare = document.getElementById('psColorSquare');
        const squareMarker = document.getElementById('squareMarker');
        const psHueSlider = document.getElementById('psHueSlider');
        const hueMarker = document.getElementById('hueMarker');
        const psHexInput = document.getElementById('psHexInput');
        const headerColorPreview = document.getElementById('headerColorPreview');

        let currentHue = 0;          // Kırmızı
        let currentSaturation = 0;   // Siyah için %0 doygunluk
        let currentBrightness = 0;   // Siyah için %0 parlaklık

        function hsvToRgb(h, s, v) {
            s /= 100;
            v /= 100;
            let c = v * s;
            let x = c * (1 - Math.abs((h / 60) % 2 - 1));
            let m = v - c;
            let r = 0, g = 0, b = 0;

            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }

            return [
                Math.round((r + m) * 255),
                Math.round((g + m) * 255),
                Math.round((b + m) * 255)
            ];
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function updateColor(updateInput = true) {
            let [r, g, b] = hsvToRgb(currentHue, currentSaturation, currentBrightness);
            let hex = rgbToHex(r, g, b);

            if (updateInput) {
                psHexInput.value = hex;
            }
            headerColorPreview.style.backgroundColor = hex;

            if (activeStarContainer) {
                activeStarContainer.querySelector('.star-icon').setAttribute('fill', hex);
            }

            // Kare arka planı için saf Hue rengi
            let [pr, pg, pb] = hsvToRgb(currentHue, 100, 100);
            psColorSquare.style.backgroundColor = `rgb(${pr}, ${pg}, ${pb})`;
        }

        // Kare üzerinde sürükleme (Doygunluk ve Parlaklık)
        function updateSquareFromCoords(clientX, clientY) {
            const rect = psColorSquare.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));

            currentSaturation = (x / rect.width) * 100;
            currentBrightness = 100 - (y / rect.height) * 100;

            squareMarker.style.left = `${(x / rect.width) * 100}%`;
            squareMarker.style.top = `${(y / rect.height) * 100}%`;

            updateColor(true);
        }

        let isDraggingSquare = false;
        psColorSquare.addEventListener('mousedown', (e) => {
            isDraggingSquare = true;
            updateSquareFromCoords(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingSquare) return;
            updateSquareFromCoords(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => { isDraggingSquare = false; });

        psColorSquare.addEventListener('touchstart', (e) => {
            isDraggingSquare = true;
            updateSquareFromCoords(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (!isDraggingSquare) return;
            updateSquareFromCoords(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', () => { isDraggingSquare = false; });


        // Dikey Şerit üzerinde sürükleme (Renk Tonu / Hue)
        function updateHueFromCoords(clientY) {
            const rect = psHueSlider.getBoundingClientRect();
            let y = clientY - rect.top;
            y = Math.max(0, Math.min(y, rect.height));

            currentHue = (y / rect.height) * 360;
            if (currentHue >= 360) currentHue = 359.9;

            hueMarker.style.top = `${(y / rect.height) * 100}%`;

            updateColor(true);
        }

        let isDraggingHue = false;
        psHueSlider.addEventListener('mousedown', (e) => {
            isDraggingHue = true;
            updateHueFromCoords(e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingHue) return;
            updateHueFromCoords(e.clientY);
        });
        window.addEventListener('mouseup', () => { isDraggingHue = false; });

        psHueSlider.addEventListener('touchstart', (e) => {
            isDraggingHue = true;
            updateHueFromCoords(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (!isDraggingHue) return;
            updateHueFromCoords(e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', () => { isDraggingHue = false; });


        // Manuel HEX giriş desteği
        psHexInput.addEventListener('input', function() {
            let val = this.value.trim();
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                headerColorPreview.style.backgroundColor = val;
                if (activeStarContainer) {
                    activeStarContainer.querySelector('.star-icon').setAttribute('fill', val);
                }
            }
        });

        // Başlangıç renk güncellemesi (#000000)
        updateColor(true);
    </script>

</body>
</html>
