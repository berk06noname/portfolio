<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Logo Sunumu - Çoklu Yıldız & Renk Seçimi</title>
    <style>
        /* Genel Sıfırlama */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #333333; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil Ekran Çerçevesi */
        .mobile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 430px; 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        /* Kutuların Genel Tasarımı */
        .box {
            border: 4px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #000000;
            width: 100%;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .box-logo {
            height: 280px; 
            flex-direction: column;
            gap: 12px;
        }

        .box-standard {
            height: 100px; 
        }

        /* --- ÇOKLU YILDIZ GRUBU --- */
        .stars-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .star-icon {
            width: 65px;
            height: 65px;
            /* Renk geçişini yumuşak ve akıcı kılıyoruz */
            transition: fill 0.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s ease;
        }

        /* Ortadaki ana yıldız karizmatik durması için biraz daha büyük */
        .star-icon.main-star {
            width: 85px;
            height: 85px;
        }

        .star-icon:hover {
            transform: scale(1.08) rotate(5deg);
        }

        /* --- PRO RENK PALETİ ANİMASYONU --- */
        .color-box {
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .palette {
            display: flex;
            gap: 0; 
            justify-content: center;
            align-items: center;
            transition: gap 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .color-box.is-open .palette {
            gap: 16px; 
        }

        /* Squarcle (Yuvarlatılmış Kare) Tasarımı */
        .color-swatch {
            width: 0; 
            height: 48px; 
            border-radius: 14px; 
            opacity: 0;
            transform: scale(0.3); 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08); 
            border: 2px solid transparent;
        }

        .color-swatch.is-active {
            width: 48px;
            opacity: 1;
            transform: scale(1);
            border-color: rgba(0,0,0,0.15); 
        }

        .color-box.is-open .color-swatch {
            width: 48px;
            opacity: 1;
            transform: scale(1);
        }

        .color-box.is-open .color-swatch:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        /* En alttaki çözünürlük yazısı */
        .footer-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: auto; 
            padding-top: 40px;
            padding-bottom: 20px;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- Çoklu Yıldız Logo Alanı -->
        <div class="box box-logo">
            <div class="stars-wrapper">
                <!-- Sol Yıldız -->
                <svg class="star-icon" viewBox="0 0 24 24" fill="#000000">
                    <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                </svg>
                <!-- Ana (Ortadaki Büyük) Yıldız -->
                <svg class="star-icon main-star" viewBox="0 0 24 24" fill="#000000">
                    <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                </svg>
                <!-- Sağ Yıldız -->
                <svg class="star-icon" viewBox="0 0 24 24" fill="#000000">
                    <path d="M12 .587l3.668 7.431 8.2 1.151-6.064 5.828 1.58 8.137L12 18.896l-7.384 3.882 1.58-8.137-6.064-5.828 8.2-1.151z"/>
                </svg>
            </div>
        </div>

        <!-- Pro İnteraktif Renk Paleti Alanı -->
        <div class="box box-standard color-box" id="colorBox">
            <div class="palette">
                <div class="color-swatch is-active" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-swatch" style="background-color: #8C8080;" data-color="#8C8080"></div>
                <div class="color-swatch" style="background-color: #E60000;" data-color="#E60000"></div>
                <div class="color-swatch" style="background-color: #DDE21A;" data-color="#DDE21A"></div>
            </div>
        </div>

        <!-- Tipografi Alanı -->
        <div class="box box-standard">
            font-family
        </div>

        <!-- İletişim / WhatsApp Alanı -->
        <div class="box box-standard">
            contact-whatsapp
        </div>

        <!-- Alt Bilgi -->
        <div class="footer-text">
            iPhone 17 Pro Max Resolution
        </div>

    </div>

    <!-- Pürüzsüz Etkileşim ve Çoklu Yıldız Senkronizasyon Mantığı -->
    <script>
        const colorBox = document.getElementById('colorBox');
        const starIcons = document.querySelectorAll('.star-icon');
        const swatches = document.querySelectorAll('.color-swatch');

        colorBox.addEventListener('click', function(event) {
            const clickedSwatch = event.target.closest('.color-swatch');
            
            if (colorBox.classList.contains('is-open')) {
                if (clickedSwatch) {
                    // 1. Seçilen rengi al
                    const selectedColor = clickedSwatch.getAttribute('data-color');
                    
                    // 2. Üstteki TÜM yıldızların rengini aynı anda güncelle
                    starIcons.forEach(star => {
                        star.setAttribute('fill', selectedColor);
                    });
                    
                    // 3. Aktif renk kutucuğunu güncelle
                    swatches.forEach(s => s.classList.remove('is-active'));
                    clickedSwatch.classList.add('is-active');
                }
                colorBox.classList.remove('is-open');
            } else {
                colorBox.classList.add('is-open');
            }
        });
    </script>

</body>
</html>
